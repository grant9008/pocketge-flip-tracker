# The hub's search (PluginHubPanel + PluginSearch + Text.matchesSearchTerms)
# works like this, and the description and tags above are written for it:
#   * the query is split on spaces and EVERY term must match - it is AND, not
#     OR, so "money making" fails unless BOTH words are found somewhere;
#   * a term matches when any keyword CONTAINS it as a substring, or is within
#     a Jaro-Winkler distance of 0.9 - so "flipping" already answers "flip",
#     and a longer keyword covers the shorter words inside it;
#   * keywords are the display name and description split on spaces and
#     lowercased, the author, and the tags added WHOLE and NOT lowercased.
# Two consequences worth not relearning: tags must be lowercase or a
# lowercased query can never substring-match them, and a multi-word tag like
# "money making" is one keyword that answers both of its words at once.
# THIS is the version the plugin hub displays, not build.gradle's. Because
# build=standard below, the hub's packager REPLACES our build.gradle with its
# own template before building (Plugin.java:551) and only falls back to
# build.gradle's version when build=gradle (Plugin.java:691). An empty value
# here is legal but makes the hub label the release with the first 8
# characters of the commit hash instead of a version number
# (Plugin.java:698). Keep this in step with build.gradle.
version=0.6.1
build=standard
